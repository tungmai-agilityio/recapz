name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Only superseded pull request runs are cancelled; every push to main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  # A docs-only PR (see scripts/ci-changes.sh) still runs every job so the required check names report a pass;
  # the heavy steps in rust and web are skipped instead. A skipped job would read as "skipping" to the auto-merge check.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: f
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git diff --name-only --no-renames "origin/$BASE_REF...HEAD" | ./scripts/ci-changes.sh >> "$GITHUB_OUTPUT"
          else
            echo code=true >> "$GITHUB_OUTPUT"
          fi
        env:
          BASE_REF: ${{ github.base_ref }}
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/test-push-guards.sh
      - run: ./scripts/test-automerge.sh
      - run: ./scripts/test-deploy-recv.sh
      - run: ./scripts/test-health.sh
  rust:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'
      # Caches dependencies only and prunes stale build output; caching all of `target` grew past the
      # runner's free disk and failed the restore ("No space left on device").
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: needs.changes.outputs.code == 'true'
      # Fails on any new RustSec advisory
      - run: cargo install cargo-audit --locked
        if: needs.changes.outputs.code == 'true'
      - run: cargo audit
        if: needs.changes.outputs.code == 'true'
      - run: cargo fmt --check
        if: needs.changes.outputs.code == 'true'
      - run: cargo clippy --workspace --all-targets -- -D warnings
        if: needs.changes.outputs.code == 'true'
      - run: cargo test --workspace
        if: needs.changes.outputs.code == 'true'
  web:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.code == 'true'
        with: { node-version: lts/* }
      - run: corepack enable
        if: needs.changes.outputs.code == 'true'
      # Run inside web/ so corepack reads the pinned packageManager from web/package.json.
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.code == 'true'
        working-directory: web
      - run: pnpm lint
        if: needs.changes.outputs.code == 'true'
        working-directory: web
      - run: pnpm test
        if: needs.changes.outputs.code == 'true'
        working-directory: web
      - run: pnpm build
        if: needs.changes.outputs.code == 'true'
        working-directory: web
