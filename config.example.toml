data_dir = "./data"
base_url = "http://localhost:8080"
bind = "127.0.0.1:8080"
bootstrap_admin_email = ""   # first admin, invited on first start
speech_model = "./models/ggml-large-v3-turbo.bin"  # ggml file; needs a build with --features whisper
embedder = "hash"  # Ask text embedder; "hash" is built in (word overlap, no model download)
ask_per_minute = 20  # questions per member per minute
dev_login = false            # local development only: enables POST /auth/dev-login

[google]
client_id = ""
client_secret = ""

# Meeting reports. Leave `provider` empty to skip reports.
# Only transcript text is sent to the provider; audio never leaves the server.
[llm]
provider = ""            # "anthropic" or "openai" (any OpenAI-compatible server)
base_url = ""            # required for "openai", e.g. http://localhost:8000/v1
api_key = ""
model = ""
max_tokens = 2048
price_input = 0          # micro-USD per million input tokens
price_output = 0         # micro-USD per million output tokens
