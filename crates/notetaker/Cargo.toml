[package]
name = "recapz-notetaker"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
base64 = "0.22"
chromiumoxide = "0.9.1"
futures-util = "0.3"
recapz-core = { path = "../core" }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt", "macros", "time", "process", "sync"] }

[features]
# Tests that start a real Chromium (`make test-browser`). Without it they are not compiled.
browser-tests = []
