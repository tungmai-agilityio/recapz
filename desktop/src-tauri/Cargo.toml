[package]
name = "recapz-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2" # confirm before closing the window on a recording
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] } # the audio_start mode argument
serde_json = "1"
# System audio tap (macOS only app, see docs/specs/desktop-app.md).
objc2 = "0.6"
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSDictionary", "NSProcessInfo", "NSString", "NSUUID", "NSValue"] }
block2 = "0.6"
