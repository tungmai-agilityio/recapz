[package]
name = "eval"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
unicode-normalization = "0.1"
recapz-core = { path = "../core" }
# Calls the model through the same Router the server uses, to score live answers.
recapz-llm = { path = "../llm" }
# `ask --embedder hosted` builds the server's own hosted embedder from its config, so both read the same settings.
recapz-server = { path = "../server" }
rusqlite = { version = "0.43", features = ["bundled"] }
serde_json = "1"
# Runs the async model calls from main; already used by recapz-llm and the server.
tokio = { version = "1", features = ["macros", "rt"] }

[dev-dependencies]
# Test-only mock model implementing the Provider trait; already used by recapz-llm.
async-trait = "0.1"
# Local stand-in for the embeddings endpoint in the hosted-path test; already used by recapz-server.
axum = "0.8"
