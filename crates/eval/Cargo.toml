[package]
name = "eval"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
unicode-normalization = "0.1"
recapz-core = { path = "../core" }
# Calls the model through the same Router the server uses, to score live answers.
recapz-llm = { path = "../llm" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
# Runs the async model calls from main; already used by recapz-llm and the server.
tokio = { version = "1", features = ["macros", "rt"] }

[dev-dependencies]
# Test-only mock model implementing the Provider trait; already used by recapz-llm.
async-trait = "0.1"
