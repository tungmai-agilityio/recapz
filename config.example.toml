data_dir = "./data"
base_url = "http://localhost:8080"
bind = "127.0.0.1:8080"
bootstrap_admin_email = ""   # first admin, invited on first start
embedder = "hash"  # Ask text embedder: "hash" (built in, no download) or "hosted" (uses [llm] embedding_*; sends text to that provider)
ask_per_minute = 20  # questions per member per minute
monthly_cap_usd = 0          # estimated spend per month (speech + language model) after which new paid jobs wait until next month; 0 = no cap
dev_login = false            # local development only: enables POST /auth/dev-login
max_concurrent_calls = 2     # calls the notetaker may be in at once
max_call_minutes = 240       # hard cap on one call

# Hosted speech (Deepgram). All call and upload audio is sent to this provider.
# The key is never read from this file: set RECAPZ_SPEECH_KEY in the environment (or /etc/recapz/recapz.env).
# The server refuses to start without it.
[speech]
# base_url = "https://api.deepgram.com"   # override only for tests
price_per_minute_micro_usd = 7800   # estimate per audio minute: batch about $0.0058 + speaker labels about $0.0020 (list prices, can change; check yours)

# Private S3-compatible bucket (any S3-compatible provider) for finished recordings. After a
# successful transcript the recording is uploaded and the local copy removed; playback streams from the
# bucket through the server. Leave `bucket` empty to keep recordings on local disk.
# The access key is never read from this file: set RECAPZ_STORAGE_KEY_ID and RECAPZ_STORAGE_SECRET in the environment.
[storage]
endpoint = ""            # e.g. "https://s3.example.com"
region = ""              # e.g. "region-1"
bucket = ""              # must be private

[google]
client_id = ""
client_secret = ""

# Meeting reports. Leave `provider` empty to skip reports.
# Only transcript text, documents marked "May be sent to the language model" and a member's question
# text are sent to the provider (also to the embedding endpoint); audio goes only to the speech provider above.
[llm]
provider = ""            # "anthropic" or "openai" (any OpenAI-compatible server)
base_url = ""            # required for "openai", e.g. http://localhost:8000/v1
api_key = ""            # or set RECAPZ_LLM_KEY in the environment (it wins; use it in production)
model = ""
embedding_model = ""     # for embedder = "hosted": POST {base}/embeddings; changing it re-indexes meetings at start
embedding_base_url = ""  # empty uses base_url; api_key is reused
max_tokens = 2048   # reasoning models (gpt-5 family) spend this on thinking first; start at 8192 for them
price_input = 0          # micro-USD per million input tokens
price_output = 0         # micro-USD per million output tokens

# The browser notetaker joins calls with a saved Google sign-in:
#   recapz notetaker-login    opens a window once to sign in the notetaker's account
#   recapz notetaker-logout   deletes the saved sign-in
# Also set RECAPZ_SECRET_KEY (64 hex characters) in the environment for calendar connect.
[notetaker]
chromium_path = ""       # empty searches the usual locations
