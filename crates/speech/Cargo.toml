[package]
name = "recapz-speech"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
symphonia = { version = "0.5", default-features = false, features = ["wav", "mp3", "aac", "isomp4", "ogg", "vorbis", "flac", "pcm", "mkv"] }
rubato = "0.16"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
whisper-rs = { version = "0.14", optional = true }

[features]
# Real recognizer; needs cmake and builds whisper.cpp. Off by default so tests stay fast.
whisper = ["dep:whisper-rs"]
# whisper.cpp with CUDA; needs the CUDA toolkit. Release builds only.
cuda = ["whisper", "whisper-rs/cuda"]

[dev-dependencies]
tempfile = "3"
