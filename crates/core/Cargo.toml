[package]
name = "recapz-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
rusqlite_migration = "2"
anyhow = "1"
recapz-speech = { path = "../speech" }
uuid = { version = "1", features = ["v7"] }
serde_json = "1"
chacha20poly1305 = "0.11.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
