name: pr-size
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: node scripts/pr-size.mjs "origin/${{ github.base_ref }}"
        env:
          SIZE_EXCEPTION: ${{ contains(github.event.pull_request.labels.*.name, 'size-exception') }}
